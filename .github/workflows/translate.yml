name: English drafts

# 日本語の記事（src/notes の加筆・videos.json の台本）が変わった PR に、英語版を足してコミットする。
# 英語版がない記事と、日本語が変わった記事を翻訳する（マージで AI 翻訳として公開される）。
# Secrets の ANTHROPIC_API_KEY がないときは何もしない
on:
  pull_request:
    paths:
      - 'src/notes/**'
      - 'src/data/videos.json'

permissions:
  contents: write

concurrency:
  group: translate-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  translate:
    # 同じリポジトリのブランチからの PR だけ（フォークには API キーを渡さない）。
    # pnpm sync の PR（content/sync-…）は手元で翻訳してからすぐマージするので対象外
    if: github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'content/sync-')
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 英語版を作る
        if: env.ANTHROPIC_API_KEY != ''
        run: pnpm translate --auto
      - name: 壊れていないか確かめる
        if: env.ANTHROPIC_API_KEY != ''
        run: pnpm build
      - name: 英語版をコミットする
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          git add src/translations
          if git diff --cached --quiet; then
            echo "英語版に変更はありません"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'content: 英語版を追加・更新（GitHub Actions）'
          git push
